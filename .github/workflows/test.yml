name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components tests
      - name: Check release tag matches the installed version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('custom_components/zentraly/manifest.json').read_text())['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag and manifest version differ'
          PY
